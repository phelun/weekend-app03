name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/phelun/weekend-app03

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable image
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Attest image provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Check out GitOps repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: phelun/weekend-platform-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Open GitOps promotion pull request
        if: github.event_name == 'push'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: weekend-app03
          IMAGE_SHA: ${{ github.sha }}
          MANIFEST: applications/overlays/dev/app03/deployment-patch.yaml
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          branch="promote/${APP_NAME}-${IMAGE_SHA:0:12}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Promotion branch $branch already exists; nothing to create."
            exit 0
          fi

          python3 ../scripts/promote.py "$MANIFEST" "ghcr.io/phelun/$APP_NAME" "$IMAGE_SHA"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "chore: promote $APP_NAME to $IMAGE_SHA"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo phelun/weekend-platform-gitops \
            --base main \
            --head "$branch" \
            --title "chore: promote $APP_NAME to ${IMAGE_SHA:0:12}" \
            --body "Promotes $APP_NAME after its tests, security scan, image publication, and provenance attestation passed. Source commit: $SOURCE_URL"
